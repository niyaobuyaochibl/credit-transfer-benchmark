[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transfer-check"
version = "0.1.0"
description = "Checklist tools for evaluating how models of human choice transfer when the feedback format changes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["transfer_check"]
